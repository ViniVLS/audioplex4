name: Build Android (AudioPlex4)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Toolchain
      # ---------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'

      # ---------------------------------------------------------------
      # Dependencies
      # ---------------------------------------------------------------
      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # ---------------------------------------------------------------
      # Versioning + Build Angular
      # ---------------------------------------------------------------
      - name: Bump version (package.json + environments)
        run: node scripts/bump-version.cjs patch --skip-gradle

      - name: Write production environment
        env:
          NG_APP_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NG_APP_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/write-env.cjs

      - name: Build Angular (production)
        run: npx ng build --configuration production
        working-directory: frontend

      # ---------------------------------------------------------------
      # Capacitor Add + Sync
      # ---------------------------------------------------------------
      - name: Add Android platform
        run: npx cap add android

      - name: Capacitor Sync
        run: npx cap sync android

      # ---------------------------------------------------------------
      # Signing (decode keystore - release only)
      # ---------------------------------------------------------------
      - name: Decode Keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          STORE_PASS="${ANDROID_KEYSTORE_PASSWORD}"
          KEY_PASS="${ANDROID_KEY_PASSWORD}"
          [ ${#STORE_PASS} -lt 6 ] && STORE_PASS="${STORE_PASS}Pass123"
          [ ${#KEY_PASS} -lt 6 ] && KEY_PASS="${KEY_PASS}Pass123"

          rm -f android/app/release.keystore
          echo "${ANDROID_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > android/app/release.keystore 2>/dev/null || true

          if [ ! -s android/app/release.keystore ] || ! keytool -list -keystore android/app/release.keystore -storepass "${STORE_PASS}" > /dev/null 2>&1; then
            rm -f android/app/release.keystore
            echo "Keystore inválido ou ausente. Gerando novo keystore..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -storepass "${STORE_PASS}" \
              -keypass "${KEY_PASS}" \
              -alias "${ANDROID_KEY_ALIAS}" \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=AudioPlex4, OU=Dev, O=AudioPlex4, L=SP, ST=SP, C=BR"
          fi
          keytool -list -keystore android/app/release.keystore -storepass "${STORE_PASS}"
          echo "KEYSTORE_PASS=${STORE_PASS}" >> $GITHUB_ENV
          echo "KEY_PASS=${KEY_PASS}" >> $GITHUB_ENV

      - name: Prepare Android (version + signing + plugins)
        run: node scripts/prepare-android.cjs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # ---------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------
      - name: Build debug APK (pull requests)
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Build release bundle + APK (signed)
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -PANDROID_KEYSTORE_PATH="${ANDROID_KEYSTORE_PATH}" \
            -PANDROID_KEYSTORE_PASSWORD="${KEYSTORE_PASS}" \
            -PANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS}" \
            -PANDROID_KEY_PASSWORD="${KEY_PASS}"
          ./gradlew assembleRelease --no-daemon \
            -PANDROID_KEYSTORE_PATH="${ANDROID_KEYSTORE_PATH}" \
            -PANDROID_KEYSTORE_PASSWORD="${KEYSTORE_PASS}" \
            -PANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS}" \
            -PANDROID_KEY_PASSWORD="${KEY_PASS}"
        working-directory: android

      # ---------------------------------------------------------------
      # Artifacts
      # ---------------------------------------------------------------
      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AudioPlex4-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload release AAB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: AudioPlex4-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: AudioPlex4-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # ---------------------------------------------------------------
      # GitHub Release (only on version tags)
      # ---------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk

      # ---------------------------------------------------------------
      # Commit version bump (main branch only)
      # ---------------------------------------------------------------
      - name: Commit version bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: bump version to $(node -p "require('./package.json').version")"
          git push